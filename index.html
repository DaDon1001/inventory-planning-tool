const N_DAYS=365, CASH_DAYS=485;   // cash table runs 1 Jan 2025 – 30 Apr 2026 so every 2025 invoice is collected

function dayDate(i){ const d=new Date(Date.UTC(2025,0,1)); d.setUTCDate(d.getUTCDate()+i); return d; }
function fmtDate(i){ const d=dayDate(i); return String(d.getUTCDate()).padStart(2,"0")+"."+String(d.getUTCMonth()+1).padStart(2,"0")+"."+d.getUTCFullYear(); }
const cwOf = day => Math.floor((day + 2) / 7) + 1;   // = WEEKNUM(date,2): weeks start Monday, 1 Jan 2025 is a Wednesday
const sum = a => a.reduce((x, y) => x + y, 0);

function salesOf(k){
  const daily=new Array(N_DAYS).fill(0), weekly=new Array(54).fill(0);
  for (const [day, sku, qty] of DATA.orders) if (sku === k) { daily[day] += qty; weekly[cwOf(day)] += qty; }
  return {daily, weekly};
}
function stats(v){ const n=v.length, avg=sum(v)/n, sd=Math.sqrt(sum(v.map(x=>(x-avg)**2))/(n-1)); return {avg, sd, variation: sd/avg, low: Math.min(...v), high: Math.max(...v)}; }

function computeProduct(k, inp){
  const s=DATA.skus[k], L=inp.leadWeeks*7, mult=inp.multiple[s], extra=inp.extra[s], pp=inp.pp[s], sale=inp.salePrice[SIZE(s)], H=inp.handlingWeeks*7;
  const {daily, weekly}=salesOf(k);
  const st=stats(weekly.slice(2,53));                       // weeks 2–52
  const roll=daily.map((_,i)=> i+1>=L ? sum(daily.slice(i-L+1,i+1)) : null);
  const lv={};
  lv.avg=st.avg; lv.lt=inp.leadWeeks;
  lv.ltd=Math.round(st.avg*inp.leadWeeks);                  // 3 = 1 × 2
  lv.peak=Math.max(...roll.filter(v=>v!==null));            // 4
  lv.extra=extra;                                           // 5
  lv.min=(inp.basis==="Average"?lv.ltd:lv.peak)+extra;      // 6
  lv.ss=lv.min-lv.ltd;                                      // 7
  lv.mult=mult; lv.max=lv.min+mult;                         // 8, 9
  lv.first=sum(daily.slice(0,L));                           // 10
  lv.open=lv.first+lv.ss;                                   // 11
  const rows=[], orders=[];
  for (let i=0;i<N_DAYS;i++){
    const sold=daily[i];
    const received = i===0 ? 0 : orders.filter(o=>o.arrival===i).reduce((a,o)=>a+o.qty,0);
    const before = i===0 ? lv.open : rows[i-1].shelf;
    const shelf=Math.max(0,before+received-sold), lost=Math.max(0,sold-(before+received));
    const onOrder = i===0 ? 0 : rows[i-1].onOrder+rows[i-1].order-received;
    const position=shelf+onOrder;
    const order = position<=lv.min ? (Math.floor((lv.min-position)/mult)+1)*mult : 0;
    if (order) orders.push({no:orders.length+1, day:i, qty:order, arrival:i+L});
    const never=lv.open-sum(daily.slice(0,i+1));
    const recent=sum(daily.slice(Math.max(0,i-inp.window+1),i+1))/Math.min(inp.window,i+1);
    const daysLeft = recent===0 ? 999 : shelf/recent;
    const next=orders.filter(o=>o.arrival>i).map(o=>o.arrival-i);
    const until = next.length ? Math.min(...next) : null;
    const status = shelf>=lv.ss ? "above" : until===null ? "nodelivery" : daysLeft>=until ? "safe" : "notsafe";
    // Task 2 columns
    const inHandling=orders.filter(o=>o.arrival>i && o.arrival<=i+H).reduce((a,o)=>a+o.qty,0);
    const inTransit=onOrder+order-inHandling;
    rows.push({i,sold,roll:roll[i],received,shelf,lost,onOrder,position,order,never,recent,daysLeft,until,status,
      purchases:order*pp, inHandling, inTransit, vShelf:shelf*pp, vHand:inHandling*pp, vTrans:inTransit*pp, vTotal:(shelf+inHandling+inTransit)*pp, revenue:sold*sale});
  }
  const res={ n:orders.length, total:sum(orders.map(o=>o.qty)), avgShelf:sum(rows.map(r=>r.shelf))/N_DAYS,
    maxShelf:Math.max(...rows.map(r=>r.shelf)), low:Math.min(...rows.map(r=>r.shelf)), lost:sum(rows.map(r=>r.lost)),
    close:rows[N_DAYS-1].shelf, hiWeek:st.high, below:rows.filter(r=>r.status!=="above").length,
    notSafe:rows.filter(r=>r.status==="notsafe"||r.status==="nodelivery").length, runOut:rows.findIndex(r=>r.never<0),
    purchases:sum(rows.map(r=>r.purchases)), avgVShelf:sum(rows.map(r=>r.vShelf))/N_DAYS, avgVTotal:sum(rows.map(r=>r.vTotal))/N_DAYS };
  res.ok = res.close>=res.hiWeek;
  const moq=inp.sizeMoq[SIZE(s)]; res.multOk = mult>=moq && mult%moq===0;
  return {k, sku:s, desc:DATA.desc[k], size:SIZE_NAME[SIZE(s)], pp, sale, daily, weekly, st, lv, rows, orders, res};
}

function computeCash(all, inp){
  const N=CASH_DAYS, SD=inp.supplierWeeks*7;
  const outOpen=new Array(N).fill(0), outPre=new Array(N).fill(0), outBal=new Array(N).fill(0), cin=new Array(N).fill(0), inv=new Array(N).fill(0);
  const openValue=sum(all.map(p=>p.lv.open*p.pp));
  outOpen[0]=inp.openPaid*openValue;
  for (const p of all) for (const r of p.rows){ outPre[r.i]+=inp.prepay*r.purchases; if (r.i+SD<N) outBal[r.i+SD]+=(1-inp.prepay)*r.purchases; }
  let unpaid=0;
  for (const [day,k,qty,c] of DATA.orders){
    const v=qty*inp.salePrice[SIZE(DATA.skus[k])], id=day+inp.invoiceDelay, pd=id+inp.terms[DATA.countries[c]];
    if (id<N) inv[id]+=v; if (pd<N) cin[pd]+=v; else unpaid+=v;
  }
  const days=[]; let cum=0, rec=0;
  for (let d=0; d<N; d++){ const out=outOpen[d]+outPre[d]+outBal[d], net=cin[d]-out; cum+=net; rec+=inv[d]-cin[d];
    days.push({d, outOpen:outOpen[d], outPre:outPre[d], outBal:outBal[d], out, cin:cin[d], net, cum, inv:inv[d], rec}); }
  const weeks=[]; let wc=0;
  for (let w=0; w<70; w++){ const a=-2+7*w, sl=days.filter(x=>x.d>=a&&x.d<a+7), o=sum(sl.map(x=>x.out)), n=sum(sl.map(x=>x.cin)); wc+=n-o; weeks.push({start:a,out:o,cin:n,net:n-o,cum:wc}); }
  const months=[]; let mc=0;
  for (let m=0; m<16; m++){ const sl=days.filter(x=>{const dt=dayDate(x.d); return (dt.getUTCFullYear()-2025)*12+dt.getUTCMonth()===m;}); const o=sum(sl.map(x=>x.out)), n=sum(sl.map(x=>x.cin)); mc+=n-o; months.push({m,out:o,cin:n,net:n-o,cum:mc}); }
  const y25=days.filter(x=>x.d<N_DAYS);
  const k={ out25:sum(y25.map(x=>x.out)), openPaid:outOpen[0], in25:sum(y25.map(x=>x.cin)) };
  k.net25=k.in25-k.out25;
  k.minCum=Math.min(...days.map(x=>x.cum)); k.minDay=days.findIndex(x=>x.cum===k.minCum);
  k.rec31=days[N_DAYS-1].rec; k.cumEnd=days[N-1].cum;
  k.sales=sum(DATA.orders.map(([d,kk,q])=>q*inp.salePrice[SIZE(DATA.skus[kk])]));
  k.cogs=sum(DATA.orders.map(([d,kk,q])=>q*inp.pp[DATA.skus[kk]]));
  k.margin=k.sales-k.cogs;
  k.avgTerm=sum(DATA.orders.map(([d,kk,q,c])=>q*inp.salePrice[SIZE(DATA.skus[kk])]*inp.terms[DATA.countries[c]]))/k.sales;
  k.unpaid=unpaid; k.openValue=openValue;
  return {days, weeks, months, k};
}
function computeValue(all){
  const T=key=>all[0].rows.map((_,i)=>sum(all.map(p=>p.rows[i][key])));
  const v={shelf:T("vShelf"), hand:T("vHand"), trans:T("vTrans"), total:T("vTotal")};
  v.avgShelf=sum(v.shelf)/N_DAYS; v.avgTotal=sum(v.total)/N_DAYS; v.max=Math.max(...v.total); v.maxDay=v.total.indexOf(v.max); v.min=Math.min(...v.total);
  v.cogs=sum(DATA.orders.map(([d,kk,q])=>q*all[kk].pp)); v.turn=v.cogs/v.avgShelf; v.dio=365/v.turn;
  return v;
}
function computeAll(inp){ const all=DATA.skus.map((_,k)=>computeProduct(k,inp)); return {all, cash:computeCash(all,inp), value:computeValue(all)}; }

const COL={blue:"#0072B2",orange:"#D55E00",green:"#009E73",ink:"#1a1a1a",muted:"#6b6b6b",grid:"#e6e6e3"};
const nf = v => v===null||v===undefined||Number.isNaN(v) ? "–" : Math.round(v).toLocaleString("en-US");
const ef = v => v===null||v===undefined ? "–" : (v<0?"−€":"€")+Math.round(Math.abs(v)).toLocaleString("en-US");
const e2 = v => "€"+v.toFixed(2);
function niceStep(raw){ if(raw<=0) return 1; const p=10**Math.floor(Math.log10(raw)); return [1,2,2.5,5,10].map(f=>f*p).find(s=>s>=raw); }
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function monthTicks(n){ const t=[]; for(let m=0;m<16;m++){ const d=Math.round((Date.UTC(2025,m,1)-Date.UTC(2025,0,1))/864e5); if(d<n && (n<400 || m%2===0)) t.push({i:d,label:MONTHS[m%12]+(m>=12?" 26":"")}); } return t; }

function lineChart(el,{title,series,refs=[],height=300,yLabel="Pieces",xTicks=null,xName=null,fmt=nf,stacked=false}){
  const W=900,H=height,m={l:112,r:120,t:38,b:38}, n=series[0].values.length;
  let stack=null;
  if(stacked){ stack=[]; let acc=new Array(n).fill(0); for(const s of series){ const lo=acc.slice(); acc=acc.map((a,i)=>a+(s.values[i]||0)); stack.push({lo,hi:acc.slice()}); } }
  const all=(stacked?stack[stack.length-1].hi:series.flatMap(s=>s.values)).concat(refs.map(r=>r.value)).filter(v=>v!==null);
  let lo=Math.min(0,...all), hi=Math.max(...all); if(hi===lo) hi=lo+1;
  const step=niceStep((hi-lo)/5); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const x=i=>m.l+(i/(n-1))*(W-m.l-m.r), y=v=>m.t+(1-(v-lo)/(hi-lo))*(H-m.t-m.b);
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(title)}"><text x="${m.l}" y="20" class="ct">${title}</text>`;
  for(let v=lo; v<=hi+1e-9; v+=step) svg+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${Math.abs(v)<1e-9?COL.muted:COL.grid}"/><text x="${m.l-8}" y="${y(v)+4}" class="ax" text-anchor="end">${fmt(v)}</text>`;
  for(const t of (xTicks||monthTicks(n))) if(t.i<n) svg+=`<text x="${x(t.i)}" y="${H-12}" class="ax" text-anchor="middle">${t.label}</text>`;
  svg+=`<text transform="translate(14 ${H/2}) rotate(-90)" class="ax" text-anchor="middle">${yLabel}</text>`;
  if(stacked){ series.forEach((s,si)=>{ const st=stack[si]; const top=st.hi.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(""); const bot=st.lo.map((v,i)=>`L${x(i).toFixed(1)},${y(v).toFixed(1)}`).reverse().join("");
      svg+=`<path d="${top}${bot}Z" fill="${s.color}" fill-opacity="0.85" stroke="#fff" stroke-width="1"/>`; }); }
  else for(const s of series){ const d=s.values.map((v,i)=>v===null?"":`${i&&s.values[i-1]!==null?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(""); svg+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" stroke-dasharray="${s.dash||""}"/>`; }
  refs.forEach((r,ri)=> svg+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(r.value)}" y2="${y(r.value)}" stroke="${r.color||COL.ink}" stroke-width="1.2" stroke-dasharray="${r.dash||""}"/><text x="${W-m.r-6}" y="${y(r.value)+(ri%2===0?-5:15)}" class="lbl" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">${r.name} ${fmt(r.value)}</text>`);
  if(!stacked) series.forEach(s=>{ if(!s.label) return; const lv=s.values[n-1]; if(lv!==null) svg+=`<text x="${W-m.r+6}" y="${y(lv)+4}" class="lbl">${s.name}</text>`; });
  svg+=`<line class="hx" y1="${m.t}" y2="${H-m.b}" stroke="${COL.muted}" visibility="hidden"/><rect class="hit" x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent"/></svg>`;
  const legend=series.map(s=>`<span class="lg"><svg width="30" height="10">${stacked?`<rect width="30" height="10" rx="2" fill="${s.color}"/>`:`<line x1="0" x2="30" y1="5" y2="5" stroke="${s.color}" stroke-width="${s.width||2}" stroke-dasharray="${s.dash||""}"/>`}</svg>${s.name}</span>`).join("")
    + refs.map(r=>`<span class="lg"><svg width="30" height="10"><line x1="0" x2="30" y1="5" y2="5" stroke="${r.color||COL.ink}" stroke-width="1.2" stroke-dasharray="${r.dash||""}"/></svg>${r.name}</span>`).join("");
  el.innerHTML=`<div class="cwrap">${svg}<div class="tip" hidden></div></div><div class="legend">${series.length+refs.length>1?legend:""}</div>`;
  const root=el.querySelector("svg"), tip=el.querySelector(".tip"), hx=el.querySelector(".hx");
  el.querySelector(".hit").addEventListener("mousemove",e=>{
    const pt=root.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const p=pt.matrixTransform(root.getScreenCTM().inverse());
    const i=Math.max(0,Math.min(n-1,Math.round((p.x-m.l)/(W-m.l-m.r)*(n-1))));
    hx.setAttribute("x1",x(i)); hx.setAttribute("x2",x(i)); hx.setAttribute("visibility","visible");
    tip.hidden=false; tip.innerHTML=`<b>${xName?xName(i):fmtDate(i)}</b>`+series.map(s=>`<div>${s.name}: <b>${fmt(s.values[i])}</b></div>`).join("")+(stacked?`<div>Total: <b>${fmt(stack[stack.length-1].hi[i])}</b></div>`:"");
    const box=el.querySelector(".cwrap").getBoundingClientRect(); tip.style.left=Math.min(e.clientX-box.left+14,box.width-200)+"px"; tip.style.top=(e.clientY-box.top+10)+"px";
  });
  el.querySelector(".hit").addEventListener("mouseleave",()=>{ tip.hidden=true; hx.setAttribute("visibility","hidden"); });
}
function barChart(el,{title,groups,series,height=300,yLabel="Pieces",fmt=nf,labelEvery=1}){
  const W=900,H=height,m={l:112,r:20,t:38,b:40};
  const hi0=Math.max(1,...series.flatMap(s=>s.values)), step=niceStep(hi0/5), hi=Math.ceil(hi0/step)*step;
  const gw=(W-m.l-m.r)/groups.length, bw=Math.max(2,Math.min(28,(gw-4)/series.length-2)), y=v=>m.t+(1-v/hi)*(H-m.t-m.b);
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(title)}"><text x="${m.l}" y="22" class="ct">${title}</text>`;
  for(let v=0; v<=hi+1e-9; v+=step) svg+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?COL.muted:COL.grid}"/><text x="${m.l-8}" y="${y(v)+4}" class="ax" text-anchor="end">${fmt(v)}</text>`;
  svg+=`<text transform="translate(14 ${H/2}) rotate(-90)" class="ax" text-anchor="middle">${yLabel}</text>`;
  groups.forEach((g,gi)=>{ const x0=m.l+gi*gw+(gw-(bw+2)*series.length+2)/2;
    series.forEach((s,si)=>{ const v=s.values[gi], xx=x0+si*(bw+2), h=Math.max(0,y(0)-y(v));
      svg+=`<path d="M${xx},${y(0)} v${-Math.max(0,h-2)} q0,-2 2,-2 h${bw-4} q2,0 2,2 v${Math.max(0,h-2)} Z" fill="${s.color}" data-f="${esc(g+" – "+s.name+": "+fmt(v))}"/>`; });
    if(gi%labelEvery===0) svg+=`<text x="${m.l+gi*gw+gw/2}" y="${H-16}" class="ax" text-anchor="middle">${g}</text>`; });
  el.innerHTML=svg+`</svg><div class="legend">${series.length>1?series.map(s=>`<span class="lg"><svg width="14" height="14"><rect width="14" height="14" rx="2" fill="${s.color}"/></svg>${s.name}</span>`).join(""):""}</div>`;
}

const fv=(value,formula)=>formula?`<span class="fv" data-f="${esc(formula)}">${value}</span>`:value;
function table(rows,cols,opts={}){
  return `<div class="tbl${opts.tall?" tall":""}"><table><thead><tr>${cols.map(c=>`<th${c.t?` data-f="${esc(c.t)}"`:""}>${c.h}</th>`).join("")}</tr></thead><tbody>`+
    rows.map(r=>`<tr${opts.rowCls?` class="${opts.rowCls(r)}"`:""}>${cols.map(c=>`<td class="${c.cls||""}">${c.x?fv(c.f(r),c.x(r)):c.f(r)}</td>`).join("")}</tr>`).join("")+`</tbody></table></div>`;
}
function formulas(items,title="How it is calculated"){ return `<details class="fx" open><summary>${title}</summary><table>${items.map(it=>`<tr><th>${it.name}</th><td><code>${it.formula}</code></td><td class="ex">${it.example||""}</td></tr>`).join("")}</table></details>`; }
function kpis(items){ return `<div class="kpis">${items.map(([l,v,note,f])=>`<div class="kpi"${f?` data-f="${esc(f)}"`:""}><div class="kl">${l}</div><div class="kv">${v}</div>${note?`<div class="kn">${note}</div>`:""}</div>`).join("")}</div>`; }
function skuPicker(id,withAll,cur){ const c=cur===undefined?STATE.sku:cur; return `<select id="${id}">${withAll?`<option value="-1" ${c<0?"selected":""}>All 9 SKUs</option>`:""}${STATE.R.all.map(q=>`<option value="${q.k}" ${q.k===c?"selected":""}>${q.sku} – ${q.desc}</option>`).join("")}</select>`; }
function recompute(){ STATE.R=computeAll(STATE.inputs); render(); }
function render(){
  document.getElementById("tabs").innerHTML=TABS.map(t=>`<button class="${t.id===STATE.tab?"on":""} ${t.cls}" data-t="${t.id}">${t.title}</button>`).join("");
  const t=TABS.find(t=>t.id===STATE.tab)||TABS[0]; STATE.tab=t.id;
  const y=scrollY; t.render(document.getElementById("view"),STATE.R,STATE.inputs); scrollTo(0,y);
  const all=STATE.R.all, bad=all.filter(p=>p.res.lost>0||!p.res.ok||!p.res.multOk).length;
  document.getElementById("status").innerHTML = bad ? `<span class="warn">⚠ ${bad} SKU(s) fail a check – see tab Levels</span>` : `<span class="okk">✓ All 9 SKUs: no lost sales, closing stock covers the highest week</span>`;
}
document.addEventListener("click",e=>{ const b=e.target.closest("#tabs button"); if(b){ STATE.tab=b.dataset.t; render(); scrollTo(0,0); } });
document.addEventListener("mouseover",e=>{ const t=e.target.closest("[data-f]"), tip=document.getElementById("ftip"); if(!t){ tip.hidden=true; return; } tip.textContent=t.dataset.f; tip.hidden=false; });
document.addEventListener("mousemove",e=>{ const tip=document.getElementById("ftip"); if(tip.hidden) return; tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-10)+"px"; tip.style.top=(e.clientY+16)+"px"; });
window.addEventListener("DOMContentLoaded",()=>{
  const g=document.getElementById("global");
  g.innerHTML=`<label>Lead time Task 1 (weeks) <input id="lt" type="number" min="1" max="26" value="${STATE.inputs.leadWeeks}"></label>
    <label>MIN based on <select id="basis"><option>Peak</option><option>Average</option></select></label>
    <label>Recent sales window (days) <input id="win" type="number" min="7" max="91" value="${STATE.inputs.window}"></label>
    <label class="sw"><input id="showf" type="checkbox"> Show formulas</label>
    <button id="reset">Reset inputs</button><span id="status"></span>`;
  g.querySelector("#lt").onchange=e=>{ STATE.inputs.leadWeeks=Math.max(1,+e.target.value||13); recompute(); };
  g.querySelector("#basis").onchange=e=>{ STATE.inputs.basis=e.target.value; recompute(); };
  g.querySelector("#win").onchange=e=>{ STATE.inputs.window=Math.max(1,+e.target.value||28); recompute(); };
  g.querySelector("#showf").onchange=e=>document.body.classList.toggle("showf",e.target.checked);
  g.querySelector("#reset").onclick=()=>{ STATE.inputs=DEFAULT_INPUTS(); g.querySelector("#lt").value=13; g.querySelector("#basis").value="Peak"; g.querySelector("#win").value=28; recompute(); };
  STATE.tab=(TABS.find(t=>"#"+t.id===location.hash)||TABS[0]).id; recompute();
});
const STATUS={above:"✓ Above safety stock",safe:"✓ Below – safe",notsafe:"⚠ Below – NOT safe",nodelivery:"⚠ Below – no delivery coming"};

// ---------------- TAB 1: Inputs ----------------

  ${table(all,[{h:"SKU",f:p=>`<b>${p.sku}</b>`},{h:"Product",f:p=>p.desc},{h:"Size",f:p=>p.size},

  <div class="grid3">
  <div><h3>Per size</h3>${table(["S","M","L"],[{h:"Size",f:s=>SIZE_NAME[s]},{h:"Supplier MOQ",f:s=>n("sizeMoq",s,100,inp.sizeMoq[s]),cls:"n"},{h:"Sale price (€/pc)",f:s=>n("salePrice",s,0.05,inp.salePrice[s]),cls:"n"}])}</div>
  <div><h3>Customer payment terms (1 importer per country)</h3>${table(DATA.countries,[{h:"Country",f:c=>c},{h:"Days",f:c=>n("terms",c,30,inp.terms[c]),cls:"n"}])}</div>
  <div><h3>Task 2 settings</h3>${table([

    ["Prepayment at order (0–1)","prepay",0.1,"Task 2 slide: 100% = 1"],
    ["Opening stock bought on 1 Jan? (1/0)","openPaid",1,"Assumption: 1 = start-up view"],

// ---------------- TAB 2: Demand ----------------

  const totalW=wk.map(w=>sum(all.map(p=>p.weekly[w]))), ts=stats(totalW.slice(1,52));
  const mon=p=>MONTHS.map((_,m)=>sum(p.daily.filter((_,i)=>dayDate(i).getUTCMonth()===m)));
  el.innerHTML=`<h2>Demand – how much each SKU sells per week</h2>
  <p class="note">Weeks 1 and 53 have only 5 and 3 days, so the statistics use weeks 2–52. Hover any number to see its formula.</p>
  ${kpis([["Total sold in 2025",nf(sum(all.map(p=>sum(p.daily)))),"all 9 SKUs","Sum of all quantities in the dataset"],
          ["Average week, all 9",nf(ts.avg),"","Average of weekly totals, weeks 2–52"],
          ["Variation, all 9",Math.round(ts.variation*100)+"%","",`SD ÷ average = ${nf(ts.sd)} ÷ ${nf(ts.avg)}`]])}
  <h3>Which time bucket to plan with? Variation = standard deviation ÷ average</h3>
  ${table(all,[{h:"SKU",f:p=>`<b>${p.sku}</b>`},
    {h:"Daily variation",f:p=>{const s=stats(p.daily);return Math.round(s.variation*100)+"%";},cls:"n",t:"SD ÷ average of 365 daily values"},
    {h:"Days with zero sales",f:p=>Math.round(p.daily.filter(v=>v===0).length/365*100)+"%",cls:"n"},
    {h:"Weekly variation",f:p=>Math.round(p.st.variation*100)+"%",cls:"n b",t:"SD ÷ average, weeks 2–52"},
    {h:"Monthly variation",f:p=>{const s=stats(mon(p));return Math.round(s.variation*100)+"%";},cls:"n",t:"SD ÷ average of 12 months"}])}
  <h3>Weekly statistics per SKU</h3>
  ${table(all,[{h:"SKU",f:p=>`<b>${p.sku}</b>`},{h:"Product",f:p=>p.desc},
    {h:"Weekly average",f:p=>nf(p.st.avg),cls:"n",t:"Average of weekly sales, weeks 2–52",x:p=>`Sum of weeks 2–52 ÷ 51 = ${nf(sum(p.weekly.slice(2,53)))} ÷ 51`},
    {h:"Standard deviation",f:p=>nf(p.st.sd),cls:"n",t:"Excel STDEV (sample)"},
    {h:"Variation",f:p=>Math.round(p.st.variation*100)+"%",cls:"n",x:p=>`${nf(p.st.sd)} ÷ ${nf(p.st.avg)}`},
    {h:"Lowest week",f:p=>nf(p.st.low),cls:"n"},{h:"Highest week",f:p=>nf(p.st.high),cls:"n"},{h:"Sold in 2025",f:p=>nf(sum(p.daily)),cls:"n"}])}
  <h3>Weekly sales ${skuPicker("dsku",true,pick)}</h3><div class="box" id="dc"></div>
  ${formulas([{name:"Variation",formula:"Standard deviation ÷ Average",example:"40% = a normal week is about 40% above or below the average"},
    {name:"Why weekly",formula:"Daily: about 1 day in 3 has zero sales → variation above 100% · Monthly: only 12 numbers, hides the busy weeks",example:"Weekly gives 51 full weeks and still shows the peaks"}])}
  <h3>Weekly table</h3>
  ${table(wk,[{h:"Week",f:w=>w+(w===1||w===53?" (partial)":"")},...all.map(p=>({h:p.sku,f:w=>nf(p.weekly[w]),cls:"n",t:`SUMIFS of ${p.sku} quantity with this calendar week`})),{h:"All 9",f:w=>`<b>${nf(totalW[w-1])}</b>`,cls:"n"}],{tall:true})}`;
  el.querySelector("#dsku").onchange=e=>{ STATE.demandSku=+e.target.value; render(); };
  const vals=pick<0?totalW.slice(1,52):all[pick].weekly.slice(2,53), avg=pick<0?ts.avg:all[pick].st.avg;
  lineChart(el.querySelector("#dc"),{title:`Weekly sales – ${pick<0?"all 9 SKUs":all[pick].sku} (weeks 2–52)`,yLabel:"Pieces per week",
    series:[{name:"Sold per week",values:vals,color:COL.blue,width:2.4}],refs:[{name:"Average",value:avg,dash:"4 3"}],
    xTicks:[0,8,18,28,38,48].map(i=>({i,label:"W"+(i+2)})),xName:i=>"Week "+(i+2)});

// ---------------- TAB 3: Levels ----------------
addTab("levels","3. Levels",(el,R,inp)=>{
  const all=R.all, L=inp.leadWeeks*7, S=f=>sum(all.map(f));
  const steps=[
    ["1. Weekly average sales",p=>p.lv.avg,"Average of weeks 2–52 (tab Demand)",null,false],
    ["2. Lead time (weeks)",p=>p.lv.lt,"Input: 3 months",null,false],
    ["3. Average sales during the lead time",p=>p.lv.ltd,"Step 1 × step 2",p=>`${nf(p.lv.avg)} × ${p.lv.lt} = ${nf(p.lv.ltd)}`,true],
    [`4. Highest sales in any ${L} days`,p=>p.lv.peak,`Largest total of ${L} days in a row in 2025`,p=>`Busiest ${L} days of ${p.sku}: ${nf(p.lv.peak)}`,true],
    ["5. Extra reserve",p=>p.lv.extra,"Input",null,true],
    ["6. MIN = Reorder point",p=>p.lv.min,`${inp.basis==="Average"?"Step 3":"Step 4"} + step 5`,p=>`${nf(inp.basis==="Average"?p.lv.ltd:p.lv.peak)} + ${nf(p.lv.extra)} = ${nf(p.lv.min)}`,true],
    ["7. Safety stock",p=>p.lv.ss,"Step 6 − step 3",p=>`${nf(p.lv.min)} − ${nf(p.lv.ltd)} = ${nf(p.lv.ss)}`,true],
    ["8. Order multiple",p=>p.lv.mult,"Input",null,false],
    ["9. MAX",p=>p.lv.max,"Step 6 + step 8",p=>`${nf(p.lv.min)} + ${nf(p.lv.mult)} = ${nf(p.lv.max)}`,true],
    ["10. Sales before the first order can arrive",p=>p.lv.first,`Sales of the first ${L} days`,null,true],
    ["11. Opening stock 1 Jan",p=>p.lv.open,"Step 10 + step 7",p=>`${nf(p.lv.first)} + ${nf(p.lv.ss)} = ${nf(p.lv.open)}`,true]];
  const results=[["Orders placed",p=>p.res.n,"Days with an order",null,true],["Pieces ordered",p=>p.res.total,"Sum of all orders",null,true],
    ["Average stock on shelf",p=>p.res.avgShelf,"Average of 365 daily values",null,true],["Highest stock on shelf",p=>p.res.maxShelf,"Warehouse space",null,false],
    ["Lowest stock on shelf",p=>p.res.low,"Smallest daily value",null,false],["Lost sales",p=>p.res.lost,"Must be 0",null,true],
    ["Closing stock 31 Dec",p=>p.res.close,"Shelf on the last day",null,true],["Highest week of 2025",p=>p.res.hiWeek,"Tab Demand",null,false],
    ["Days below safety stock",p=>p.res.below,"Using safety stock is normal",null,false],["Days flagged NOT safe",p=>p.res.notSafe,"Shelf would run out before next delivery",null,false]];
  const grid=rows=>table(rows,[{h:"Step",f:r=>`<b>${r[0]}</b>`},{h:"How",f:r=>`<span class="note">${r[2]}</span>`},
    ...all.map(p=>({h:p.sku,f:r=>nf(r[1](p)),cls:"n",x:r=>r[3]?r[3](p):r[2]})),{h:"All 9",f:r=>r[4]?`<b>${nf(S(r[1]))}</b>`:"",cls:"n"}]);
  el.innerHTML=`<h2>Inventory levels – step by step</h2><p class="note">Each step uses the steps above it. Hover a number to see the calculation.</p>
  ${grid(steps)}<h3>Check: the plan tested day by day on the real 2025 sales</h3>${grid(results)}
  ${table(all,[{h:"Check",f:p=>`<b>${p.sku}</b>`},{h:"No lost sales",f:p=>p.res.lost===0?"✓ Yes":`⚠ No – ${nf(p.res.lost)} lost`},
    {h:"Closing stock ≥ highest week",f:p=>p.res.ok?"✓ Yes":"⚠ No – add extra reserve",x:p=>`${nf(p.res.close)} ≥ ${nf(p.res.hiWeek)} ?`},{h:"Order multiple allowed",f:p=>p.res.multOk?"✓ Yes":"⚠ No"}])}
  <div class="box" id="lc"></div>`;
  barChart(el.querySelector("#lc"),{title:"Levels per SKU (pieces)",groups:all.map(p=>p.sku),
    series:[{name:"Safety stock",values:all.map(p=>p.lv.ss),color:COL.blue},{name:"MIN",values:all.map(p=>p.lv.min),color:COL.orange},{name:"MAX",values:all.map(p=>p.lv.max),color:COL.green}]});
});

    refs:[{name:"MAX",value:lv.max,dash:"10 4"},{name:"MIN",value:lv.min,dash:"4 3"},{name:"Safety",value:lv.ss,dash:"2 3",color:COL.muted}]});
  lineChart(el.querySelector("#c2"),{title:`${p.sku} – stock if I never order`,

// ---------------- TAB 5: Plan ----------------
addTab("plan","5. Plan",(el,R,inp)=>{
  const all=R.all, pick=+(STATE.planSku??-1), L=inp.leadWeeks*7, month=i=>dayDate(i).getUTCMonth();
  const list=all.flatMap(p=>p.orders.map(o=>({...o,p}))).filter(o=>pick<0||o.p.k===pick).sort((a,b)=>a.day-b.day||a.p.k-b.p.k);
  const cnt=(p,m)=>p.orders.filter(o=>month(o.day)===m).length, pcs=(p,m)=>sum(p.orders.filter(o=>month(o.day)===m).map(o=>o.qty));
  const matrix=(f,t)=>table([...all,null],[{h:"SKU",f:p=>p?`<b>${p.sku}</b>`:"<b>All 9</b>"},
    ...MONTHS.map((mn,m)=>({h:mn,f:p=>{const v=p?f(p,m):sum(all.map(q=>f(q,m)));return v?nf(v):"–";},cls:"n",t})),
    {h:"Total",f:p=>`<b>${nf(p?sum(MONTHS.map((_,m)=>f(p,m))):sum(all.map(q=>sum(MONTHS.map((_,m)=>f(q,m))))))}</b>`,cls:"n"}]);
  el.innerHTML=`<h2>Resupply plan 2025</h2>
  <p class="note">Every order comes from the daily rule: when shelf + on order reaches the MIN, order enough multiples to get back above it. Available ${L} days later (Task 2: at the warehouse ${inp.handlingWeeks*7} days before that).</p>
  ${kpis([["Orders in 2025",nf(sum(all.map(p=>p.res.n))),"all 9 SKUs"],["Pieces ordered",nf(sum(all.map(p=>p.res.total))),""],
    ["Purchase value",ef(sum(all.map(p=>p.res.purchases))),"paid at order (Task 2)"],
    ["Orders arriving in 2026",nf(sum(all.map(p=>p.orders.filter(o=>o.arrival>=N_DAYS).length))),"placed in 2025"]])}
  <div class="box" id="pc"></div>
  <h3>Number of orders per month</h3>${matrix(cnt,"Orders placed in this month")}
  <h3>Pieces ordered per month</h3>${matrix(pcs,"Pieces ordered in this month")}
  <h3>Order list ${skuPicker("psku",true,pick)}</h3>
  ${table(list,[{h:"SKU",f:o=>`<b>${o.p.sku}</b>`},{h:"Order No.",f:o=>o.no,cls:"n"},{h:"Order date (= payment)",f:o=>fmtDate(o.day)},
    {h:"Quantity",f:o=>nf(o.qty),cls:"n",x:o=>{const r=o.p.rows[o.day];return `Position ${nf(r.position)} ≤ MIN ${nf(o.p.lv.min)} → ${o.qty/o.p.lv.mult} × ${nf(o.p.lv.mult)}`;}},
    {h:"Paid (€)",f:o=>ef(o.qty*o.p.pp),cls:"n"},
    {h:"At warehouse",f:o=>fmtDate(o.arrival-inp.handlingWeeks*7)},
    {h:"Available date",f:o=>fmtDate(o.arrival)+(o.arrival>=N_DAYS?" (2026)":""),x:o=>`${fmtDate(o.day)} + ${L} days`}],{tall:true})}`;
  el.querySelector("#psku").onchange=e=>{ STATE.planSku=+e.target.value; render(); };
  barChart(el.querySelector("#pc"),{title:"Orders placed per month – all 9 SKUs",groups:MONTHS,yLabel:"Orders",series:[{name:"Orders",values:MONTHS.map((_,m)=>sum(all.map(p=>cnt(p,m)))),color:COL.blue}]});
});

// ---------------- TAB 6: Total ----------------
addTab("total","6. Total",(el,R)=>{
  const all=R.all, days=all[0].rows.map((_,i)=>i), S=(i,k)=>sum(all.map(p=>p.rows[i][k]));
  const shelf=days.map(i=>S(i,"shelf")), pos=days.map(i=>S(i,"position"));
  el.innerHTML=`<h2>Total inventory – all 9 SKUs together</h2><p class="note">Nothing is decided here. Each SKU is planned on its own; this tab adds them up.</p>
  ${kpis([["Opening stock 1 Jan",nf(sum(all.map(p=>p.lv.open))),""],["Average stock on shelf",nf(sum(shelf)/shelf.length),""],
    ["Highest stock on shelf",nf(Math.max(...shelf)),"warehouse space"],["Closing stock 31 Dec",nf(shelf[shelf.length-1]),""],["Lost sales",nf(sum(all.map(p=>p.res.lost))),"must be 0"]])}
  <div class="box" id="tc"></div>
  ${table(days,[{h:"Date",f:i=>fmtDate(i)},{h:"Sold",f:i=>nf(S(i,"sold")),cls:"n"},{h:"Received",f:i=>S(i,"received")?nf(S(i,"received")):"",cls:"n"},
    {h:"Stock on shelf",f:i=>nf(shelf[i]),cls:"n b"},{h:"On order",f:i=>nf(S(i,"onOrder")),cls:"n"},{h:"Shelf + on order",f:i=>nf(pos[i]),cls:"n"}],{tall:true})}`;
  lineChart(el.querySelector("#tc"),{title:"Total inventory, all 9 SKUs, 2025",series:[{name:"Stock on shelf",values:shelf,color:COL.blue,width:2.4},{name:"Shelf + on order",values:pos,color:COL.orange,dash:"6 4"}]});
});

// ---------------- TAB 7: Inventory value (Task 2) ----------------
addTab("value","7. Inventory value",(el,R,inp)=>{
  const all=R.all, v=R.value;
  el.innerHTML=`<h2>Task 2 – Inventory value over time (at purchase price)</h2>
  <p class="note">Value = pieces × purchase price. The supplier is paid 100% at order, so goods we paid for but cannot sell yet are also our money: <b>in transit</b> (ordered, not yet at the warehouse) and <b>in handling</b> (at MG Warehousing, the last ${inp.handlingWeeks*7} days before they can be sold).</p>
  ${kpis([["Average value on shelf",ef(v.avgShelf),"",`Average of 365 daily values of Σ shelf × price`],
    ["Average value incl. paid pipeline",ef(v.avgTotal),"shelf + handling + transit","Average of 365 daily totals"],
    ["Highest total value",ef(v.max),"on "+fmtDate(v.maxDay)],["Lowest total value",ef(v.min),""],
    ["Total value 31 Dec",ef(v.total[N_DAYS-1]),""],
    ["Inventory turnover",v.turn.toFixed(1)+"×","",`Cost of goods sold ÷ average shelf value = ${ef(v.cogs)} ÷ ${ef(v.avgShelf)}`],
    ["Days of inventory on shelf",nf(v.dio),"","365 ÷ turnover"]])}
  <div class="box" id="vc"></div>
  <h3>Per SKU</h3>
  ${table(all,[{h:"SKU",f:p=>`<b>${p.sku}</b>`},{h:"Purchase price",f:p=>e2(p.pp),cls:"n"},{h:"Opening stock value",f:p=>ef(p.lv.open*p.pp),cls:"n",x:p=>`${nf(p.lv.open)} × ${e2(p.pp)}`},
    {h:"Avg value on shelf",f:p=>ef(p.res.avgVShelf),cls:"n"},{h:"Avg total value",f:p=>ef(p.res.avgVTotal),cls:"n"},
    {h:"Closing value on shelf",f:p=>ef(p.rows[N_DAYS-1].vShelf),cls:"n"},{h:"Purchases 2025",f:p=>ef(p.res.purchases),cls:"n",x:p=>`${nf(p.res.total)} pcs × ${e2(p.pp)}`}])}
  ${formulas([{name:"Value on shelf",formula:"Stock on shelf × purchase price"},{name:"Value in handling",formula:"Orders whose available date is within the next 7 days × purchase price"},
    {name:"Value in transit",formula:"(On order + ordered today − in handling) × purchase price"},
    {name:"Why the total is almost flat",formula:"The plan keeps shelf + on order between MIN and MAX",example:"So paid stock stays around €140k while the shelf part falls from the high opening stock to its normal level by April"}])}`;
  lineChart(el.querySelector("#vc"),{title:"Inventory value per day (€) – stacked",yLabel:"€",fmt:ef,stacked:true,height:320,
    series:[{name:"On shelf",values:v.shelf,color:COL.blue},{name:"In warehouse handling",values:v.hand,color:COL.green},{name:"In transit (prepaid)",values:v.trans,color:COL.orange}]});
},"t2");

// ---------------- TAB 8: Cash flow (Task 2) ----------------
addTab("cash","8. Cash flow",(el,R,inp)=>{
  const c=R.cash, k=c.k;
  const wlab=w=>fmtDate(w.start).slice(0,5);
  el.innerHTML=`<h2>Task 2 – Cash flow profile: cash out vs cash in</h2>
  <p class="note">Cash out = order quantity × purchase price on the order date (${Math.round(inp.prepay*100)}% prepayment${inp.openPaid?"; opening stock bought on 1 Jan":""}). Cash in = every customer order of the dataset, paid on order date ${inp.invoiceDelay?"+ "+inp.invoiceDelay+" days ":""}+ its country's payment terms. Shown to 30 Apr 2026 so all 2025 invoices are collected.</p>
  ${kpis([["Cash out in 2025",ef(k.out25),"of which opening stock "+ef(k.openPaid)],["Cash in during 2025",ef(k.in25),""],["Net cash flow 2025",ef(k.net25),""],
    ["Financing need",ef(k.minCum),"lowest cumulative cash, on "+fmtDate(k.minDay),"Minimum of the cumulative cash line"],
    ["Still to collect on 31 Dec",ef(k.rec31),"open customer invoices"],["Cumulative cash 30 Apr 2026",ef(k.cumEnd),"all 2025 invoices paid"],
    ["Sales 2025",ef(k.sales),"at sale price"],["Gross margin 2025",ef(k.margin),"sales − cost of goods sold "+ef(k.cogs)],
    ["Avg customer payment term",k.avgTerm.toFixed(1)+" days","weighted by sales","Σ(sales × terms) ÷ Σ sales"]])}
  <div class="box" id="cw"></div><div class="box" id="cc"></div>
  <h3>Monthly cash flow</h3>
  ${table(c.months,[{h:"Month",f:m=>MONTHS[m.m%12]+" "+(2025+Math.floor(m.m/12))},{h:"Cash out",f:m=>ef(m.out),cls:"n"},{h:"Cash in",f:m=>ef(m.cin),cls:"n"},{h:"Net",f:m=>ef(m.net),cls:"n b"},{h:"Cumulative",f:m=>ef(m.cum),cls:"n"}])}
  ${formulas([{name:"Cash out",formula:"Order qty × purchase price × prepayment %, on the order date (+ rest on arrival at warehouse)",example:"The Task 1 order list is the payment calendar"},
    {name:"Cash in",formula:"Qty × sale price, on order date + invoice delay + payment terms of the customer's country",example:"Germany/Netherlands/Spain 30 days, France/Italy/Luxembourg/Poland/Portugal 60, Belgium/Czechia 90"},
    {name:"Cumulative cash",formula:"Yesterday's cumulative + cash in − cash out",example:"The lowest point is how much money the company must finance"},
    {name:"Why the dip",formula:"Cash leaves 13 weeks before goods can be sold and returns 30–90 days after the sale",example:"So about 4–6 months of purchases must be pre-financed"}])}`;
  barChart(el.querySelector("#cw"),{title:"Weekly cash out vs cash in (€)",groups:c.weeks.map(wlab),labelEvery:8,yLabel:"€ per week",fmt:ef,
    series:[{name:"Cash out (supplier)",values:c.weeks.map(w=>w.out),color:COL.orange},{name:"Cash in (customers)",values:c.weeks.map(w=>w.cin),color:COL.blue}]});
  lineChart(el.querySelector("#cc"),{title:"Cumulative cash (€) – lowest point = financing need",yLabel:"€",fmt:ef,
    series:[{name:"Cumulative cash",values:c.days.map(x=>x.cum),color:COL.ink,width:2.4},{name:"Open receivables",values:c.days.map(x=>x.rec),color:COL.blue,dash:"6 4"}],
    refs:[{name:"Financing need",value:k.minCum,dash:"4 3",color:COL.orange}]});
},"t2");

// ---------------- TAB 9: Formulas ----------------
addTab("formulas","9. Formulas",(el,R,inp)=>{
  const p=R.all[STATE.sku], lv=p.lv, L=inp.leadWeeks*7, r=p.rows.find(x=>x.order&&x.i>0)||p.rows[1], q=p.rows[r.i-1];
  const ex=p.rows.find(x=>x.status==="notsafe")||p.rows[200];
  el.innerHTML=`<h2>All formulas ${skuPicker("fsku")}</h2><p class="note">Plain words + the Excel formula + a live example for the SKU chosen above.</p>
  ${formulas([
    {name:"1. Variation",formula:"Standard deviation ÷ Average  ·  Excel: =STDEV(weeks 2–52)/AVERAGE(weeks 2–52)",example:`${nf(p.st.sd)} ÷ ${nf(p.st.avg)} = ${Math.round(p.st.variation*100)}%`},
    {name:"2. Weekly sales",formula:"=SUMIFS(Dataset!Quantity, Dataset!SKU, sku, Dataset!CW, week)",example:`Average ${nf(lv.avg)}`},
    {name:"3. Average sales in lead time",formula:"=ROUND(weekly average × lead time weeks, 0)",example:`${nf(lv.avg)} × ${inp.leadWeeks} = ${nf(lv.ltd)}`},
    {name:"4. Highest sales in one lead time",formula:`=MAX(column 'Sold last ${L} days')  where each day = SUMIFS(Sold, Date, ">"&today−${L}, Date, "<="&today)`,example:nf(lv.peak)},
    {name:"5. MIN = Reorder point",formula:'=IF(Basis="Average", step 3, step 4) + extra reserve',example:`${nf(inp.basis==="Average"?lv.ltd:lv.peak)} + ${nf(lv.extra)} = ${nf(lv.min)}`},
    {name:"6. Safety stock",formula:"=MIN − average sales in lead time",example:`${nf(lv.min)} − ${nf(lv.ltd)} = ${nf(lv.ss)}`},
    {name:"7. MAX",formula:"=MIN + order multiple",example:`${nf(lv.min)} + ${nf(lv.mult)} = ${nf(lv.max)}`},
    {name:"8. Opening stock 1 Jan",formula:`=sales of the first ${L} days + safety stock`,example:`${nf(lv.first)} + ${nf(lv.ss)} = ${nf(lv.open)}`},
    {name:"9. Stock on shelf",formula:"=MAX(0, yesterday's shelf + received − sold)",example:`${fmtDate(r.i)}: ${nf(q.shelf)} + ${nf(r.received)} − ${nf(r.sold)} = ${nf(r.shelf)}`},
    {name:"10. Lost sales",formula:"=MAX(0, sold − (yesterday's shelf + received))",example:`Total in 2025: ${nf(p.res.lost)}`},
    {name:"11. On order",formula:"=yesterday's on order + yesterday's order − received today",example:`${fmtDate(r.i)}: ${nf(r.onOrder)}`},
    {name:"12. Position",formula:"=shelf + on order",example:`${nf(r.shelf)} + ${nf(r.onOrder)} = ${nf(r.position)}`},
    {name:"13. Order today",formula:"=IF(position <= MIN, (INT((MIN − position) / multiple) + 1) × multiple, 0)",example:`${fmtDate(r.i)}: ${nf(r.position)} ≤ ${nf(lv.min)} → ${nf(r.order)}`},
    {name:"14. Available date",formula:`=order date + ${L}`,example:`${fmtDate(r.i)} + ${L} = ${fmtDate(r.i+L)}`},
    {name:"15. Received",formula:"=SUMIFS(orders above, available dates above, today)",example:"Only rows above → no circular reference"},
    {name:"16. Stock if I never order",formula:"=opening stock − all sales so far",example:p.res.runOut>=0?`Below zero on ${fmtDate(p.res.runOut)}`:"Never below zero"},
    {name:"17. Safe to use safety stock?",formula:`Shelf ÷ (sales last ${inp.window} days ÷ ${inp.window}) ≥ days until next delivery`,example:ex?`${fmtDate(ex.i)}: ${ex.daysLeft.toFixed(1)} vs ${ex.until??"–"} days → ${STATUS[ex.status]}`:""},
    {name:"18. Closing stock check",formula:"Closing stock 31 Dec ≥ highest week of 2025",example:`${nf(p.res.close)} ≥ ${nf(p.res.hiWeek)} → ${p.res.ok?"✓":"⚠"}`},
    {name:"19. Inventory value (Task 2)",formula:"(shelf + in handling + in transit) × purchase price",example:`${fmtDate(200)}: ${ef(p.rows[200].vTotal)}`},
    {name:"20. Cash out (Task 2)",formula:"Order qty × purchase price × prepay, on the order date",example:`${fmtDate(r.i)}: ${nf(r.order)} × ${e2(p.pp)} = ${ef(r.purchases)}`},
    {name:"21. Cash in (Task 2)",formula:"=SUMIFS(Dataset!Revenue, Dataset!Payment date, day); payment date = order date + invoice delay + terms(country)",example:"Revenue = qty × sale price"},
    {name:"22. Cumulative cash",formula:"=yesterday + cash in − cash out; financing need = MIN(cumulative)",example:ef(R.cash.k.minCum)}],"Formulas")}`;
  el.querySelector("#fsku").onchange=e=>{ STATE.sku=+e.target.value; render(); };
});

// ---------------- TAB 10: Decisions & assumptions ----------------
addTab("decisions","10. Decisions",(el,R,inp)=>{
  const avgLost=sum(computeAll({...inp,basis:"Average"}).all.map(p=>p.res.lost));
  const D=[
    ["Plan each SKU on its own","Colour is not a real group in the data; size matters only for the MOQ.","A problem in one SKU is not hidden by the others."],
    ["Plan with weekly numbers","Daily: many zero days. Monthly: 12 numbers, peaks disappear.","Weekly variation (~40%) is usable and still shows peaks."],
    ["MIN = busiest 13 weeks of 2025",`With 13 weeks of average sales, ${nf(avgLost)} pieces would be lost (tested day by day).`,"With the busiest period no sale is lost (100% service)."],
    ["Safety stock = MIN − normal 13-week sales","The part of MIN above average sales.","It IS used in busy weeks – the shelf just never hits zero."],
    ["Order daily at the MIN, in MOQ multiples, only as many as needed","Weekly sales move ±40%, a fixed calendar orders too early or too late.","Smallest stock that is still safe; no fixed 3,000."],
    ["Count stock on its way","Shelf alone is always below 3 months of sales.","Otherwise I would order every day."],
    ["Opening stock = first 13 weeks + safety stock","Not in the data; no 2025 order arrives before 2 April.","A realistic start."],
    ["Extra reserve CSBM 200, CSRM 600","Closing stock must cover the highest week (first week of 2026).","All 9 pass the closing check."],
    ["Task 2 lead time: 12 + 1 = 13 weeks","Supplier 12 weeks to the warehouse + 1 week handling = Task 1's 3 months.","The Task 1 plan is used unchanged; goods are in handling the last 7 days."],
    ["Value inventory at purchase price","Cost of what is tied up, not the sale value.","Includes prepaid goods in transit, because the cash is gone."],
    ["Cash in per real order and country","Each dataset order is paid after its country's terms.","No country shares or averages needed."]];
  const A=[
    ["A1","Lead time Task 1 = 13 weeks (91 days); Task 2 = 12 weeks supplier + 1 week warehouse = 13 weeks. Confirm the professor reads it this way (alternative: 12 weeks to available + 1 week before dispatch to customer)."],
    ["A2","Customers are invoiced on the dataset order date and pay exactly on the due date (invoice delay 0)."],
    ["A3","Start-up cash view: opening stock (€133k) paid on 1 Jan 2025, no 2024 receivables. Set 'Opening stock bought on 1 Jan' to 0 for an ongoing-business view."],
    ["A4","No freight, duties, warehouse fees, VAT or other costs (not given)."],
    ["A5","Levels are calculated and tested on the same 2025 data. A bigger peak in another year would need a higher MIN."]];
  el.innerHTML=`<h2>Decisions – what I decided and why</h2>
  ${table(D,[{h:"#",f:d=>D.indexOf(d)+1},{h:"Decision",f:d=>`<b>${d[0]}</b>`},{h:"Why",f:d=>d[1],cls:"w"},{h:"Why it matters",f:d=>d[2],cls:"w"}])}
  <h3>Assumptions to confirm</h3>${table(A,[{h:"#",f:a=>a[0]},{h:"Assumption",f:a=>a[1],cls:"w"}])}`;
});

// ---------------- TAB 11: Excel check ----------------
addTab("check","11. Excel check",(el)=>{
  const R0=computeAll(DEFAULT_INPUTS()), rows=[];
  const keys=[["min","MIN"],["ss","Safety stock"],["max","MAX"],["open","Opening stock"],["n","Orders"],["total","Pieces ordered"],["lost","Lost sales"],["close","Closing stock"],["hiWeek","Highest week"],["low","Lowest shelf"],["below","Days below SS"],["notSafe","Days NOT safe"]];
  R0.all.forEach(p=>{ const ex=EXCEL.sku[p.sku]; for(const [k,lab] of keys){ const d=k in p.lv?p.lv[k]:p.res[k]; rows.push({what:lab,sku:p.sku,excel:ex[k],dash:d}); } });
  const kk=R0.cash.k, v=R0.value;
  [["Cash out 2025",kk.out25,"out25"],["Cash in 2025",kk.in25,"in25"],["Financing need",kk.minCum,"minCum"],["Still to collect 31 Dec",kk.rec31,"rec31"],["Cumulative cash 30 Apr 2026",kk.cumEnd,"cumEnd"],
   ["Gross margin 2025",kk.margin,"margin"],["Avg value on shelf",v.avgShelf,"avgShelf"],["Avg total value",v.avgTotal,"avgTotal"],["Highest total value",v.max,"maxValue"]].forEach(([lab,d,key])=>rows.push({what:lab,sku:"All",excel:EXCEL.t2[key],dash:d,eur:true}));
  const ok=r=>Math.abs(r.excel-r.dash)<(r.eur?0.5:0.001), diff=rows.filter(r=>!ok(r));
  el.innerHTML=`<h2>Excel check – dashboard vs Excel workbook (default inputs)</h2>
  <p class="note">The Excel values were taken from the workbook after a full recalculation. The dashboard recomputes the same numbers with its own engine using the default inputs.</p>
  ${kpis([["Numbers compared",nf(rows.length),""],["Differences",nf(diff.length),diff.length?"⚠ see rows marked":"✓ all identical"]])}
  ${table(rows,[{h:"Result",f:r=>r.what},{h:"SKU",f:r=>r.sku},{h:"Excel",f:r=>r.eur?ef(r.excel):nf(r.excel),cls:"n"},{h:"Dashboard",f:r=>r.eur?ef(r.dash):nf(r.dash),cls:"n"},{h:"Same?",f:r=>ok(r)?"✓":"⚠ "+(r.dash-r.excel).toFixed(2)}],{tall:true,rowCls:r=>ok(r)?"":"flag"})}`;
});
</script></body></html>
